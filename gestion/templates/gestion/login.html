{% load static %}<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Tech-Ward Gestion</title><link rel="icon" href="{% static 'img/favicon.png' %}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'gestion/gestion.css' %}"></head>
<body><div class="login"><form class="card" method="post">{% csrf_token %}
  <img src="{% static 'img/logo-full.png' %}" alt="Tech-Ward">
  <h2 style="text-align:center">Espace de gestion</h2>
  {% if form.errors %}<p class="note">Identifiant ou mot de passe incorrect.</p>{% endif %}
  <div class="stack">
    <div class="field"><label for="id_username">Identifiant</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">Mot de passe</label>{{ form.password }}</div>
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <div class="form-actions"><button class="btn primary" style="width:100%;justify-content:center">Se connecter</button></div>
  <p class="small muted" style="text-align:center;margin:12px 0 0">Pas encore de compte ? Lancez <b>create_admin.bat</b> une fois.</p>
</form></div></body></html>
