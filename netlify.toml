# One Netlify site for the public website and Gestion (/gestion/).
# Files in public/ are served as they are; every other page comes from netlify/functions/app.mjs,
# which reads the shared data in Netlify Blobs.
[build]
  publish = "public"
  command = "echo 'Nothing to build'"

[functions]
  directory = "netlify/functions"

