<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder hero scene: replace with a real installation photo (static/img/hero.jpg) later. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9d4f1"/><stop offset=".7" stop-color="#e8f0f9"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6d9de"/><stop offset="1" stop-color="#bfc4cc"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5d74"/><stop offset="1" stop-color="#7b8ea6"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d7a1"/><stop offset="1" stop-color="#c9a46c"/></linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dfe8"/></linearGradient>
    <radialGradient id="lens" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#40536f"/><stop offset=".55" stop-color="#121c2c"/><stop offset="1" stop-color="#05090f"/></radialGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#sky)"/>
  <!-- trees -->
  <g fill="#7e9a82" opacity=".55"><circle cx="40" cy="300" r="90"/><circle cx="130" cy="340" r="70"/><circle cx="560" cy="330" r="60"/></g>
  <!-- house -->
  <g transform="translate(520 60)">
    <rect x="0" y="110" width="520" height="330" fill="#e9ebee"/>
    <rect x="-30" y="95" width="420" height="26" fill="#f6f7f9"/>
    <rect x="20" y="130" width="330" height="140" fill="url(#glass)"/>
    <rect x="30" y="140" width="140" height="120" fill="url(#warm)" opacity=".75"/>
    <rect x="190" y="140" width="150" height="120" fill="#5c6f88"/>
    <rect x="-30" y="268" width="420" height="16" fill="#f6f7f9"/>
    <path d="M-30 284h420v10H-30z" fill="#cfd3d9"/>
    <g stroke="#9aa6b5" stroke-width="3"><path d="M-20 300v-60M40 300v-60M100 300v-60M160 300v-60M220 300v-60M280 300v-60M340 300v-60"/><path d="M-30 240h420"/></g>
    <rect x="20" y="310" width="330" height="130" fill="url(#glass)" opacity=".9"/>
    <rect x="40" y="320" width="120" height="110" fill="url(#warm)" opacity=".6"/>
    <rect x="390" y="0" width="130" height="440" fill="url(#wall)"/>
    <rect x="390" y="0" width="10" height="440" fill="#adb3bc"/>
  </g>
  <!-- foreground plants -->
  <g fill="#4f7a55"><path d="M1080 500c10-80 40-120 90-140-30 40-40 90-40 140z"/><path d="M1140 500c0-60 20-100 60-120v120z"/><path d="M1030 500c-5-50 10-90 40-110-15 40-15 80-10 110z"/></g>
  <!-- camera on the wall -->
  <g transform="translate(930 150)">
    <rect x="70" y="-6" width="40" height="110" rx="10" fill="#f5f7fa" stroke="#cfd6e1" stroke-width="2"/>
    <path d="M70 40H20l-14 20h64z" fill="#eef1f5" stroke="#cfd6e1" stroke-width="2"/>
    <g transform="rotate(-14 0 60)">
      <rect x="-230" y="20" width="250" height="100" rx="46" fill="url(#cam)" stroke="#cfd6e1" stroke-width="2"/>
      <path d="M-248 14h240c12 0 16 8 16 14v4h-256c-10 0-10-18 0-18z" fill="#fbfcfd" stroke="#cfd6e1" stroke-width="2"/>
      <ellipse cx="-206" cy="70" rx="30" ry="48" fill="#0f1726"/>
      <circle cx="-203" cy="70" r="30" fill="url(#lens)"/>
      <circle cx="-203" cy="70" r="13" fill="#1d74d8" opacity=".85"/>
      <circle cx="-211" cy="61" r="6" fill="#fff" opacity=".7"/>
      <text x="-140" y="77" font-family="Inter,Arial" font-size="16" font-weight="800" fill="#16243a">TECH-WARD</text>
    </g>
  </g>
</svg>
